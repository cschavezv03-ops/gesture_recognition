# Configuración del control por gestos.
#
# Para adaptarlo a tu equipo sin tocar este archivo (ni ensuciar el repositorio),
# crea un `config.local.yaml` con solo las claves que quieras cambiar; se fusiona
# encima de este.

camera:
  # `null` autodetecta la cámara de mayor resolución, que en un equipo con Iriun
  # es siempre la del móvil. Usa `--list-cameras` para ver los índices.
  index: null
  backend: dshow        # dshow | msmf | any
  width: 1280
  height: 720
  fps: 30
  mirror: true          # Imagen en espejo: mover la mano a la derecha va a la derecha.

recognizer:
  model_path: models/gesture_recognizer.task
  # Los wheels de MediaPipe para Windows se compilan sin soporte de GPU, así que
  # `gpu` acabará cayendo a CPU con un aviso. El modelo es pequeño (8 MB) y
  # XNNPACK lo resuelve de sobra por encima de 30 FPS.
  delegate: cpu
  num_hands: 1
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5

engine:
  start_mode: control
  start_paused: false
  # Fotogramas consecutivos con la misma etiqueta antes de darla por buena.
  # Subirlo reduce disparos fantasma y aumenta la latencia percibida.
  stability_frames: 3
  min_gesture_confidence: 0.6
  # Velocidad de la palma (en anchos de mano por segundo) por encima de la cual
  # se inhiben los disparos por permanencia, para que no salten mientras se
  # coloca la mano.
  motion_gate: 2.5
  default_cooldown: 0.6

# --------------------------------------------------------------------------- #
# El gatillo: juntar pulgar e índice engancha, moverse arrastra, separarlos
# suelta. Sustituye a los barridos, que se disparaban con cualquier movimiento
# porque no tenían un momento explícito de enganche.
# --------------------------------------------------------------------------- #
pinch_drag:
  engage: 0.42          # separación pulgar-índice (normalizada) para enganchar
  release: 0.62         # histéresis para soltar
  axis_lock: 0.22       # recorrido, en anchos de mano, que decide el eje
  step: 0.30            # recorrido por paso, en anchos de mano
  tap_max_seconds: 0.6  # tiempo máximo para que una pinza cuente como toque
  # Cuánto debe sobresalir la yema del índice respecto a la palma para que la
  # pinza cuente. Descarta el puño, donde las yemas también se tocan. No se usa
  # la rectitud del dedo porque al pinzar se dobla para alcanzar el pulgar.
  min_index_reach: 0.80
  modes:
    control:
      horizontal:
        label: Pestañas
        step: 0.30      # medio ancho de mano por pestaña: recorrer cinco cabe en un gesto
        right: {action: hotkey, args: {keys: [ctrl, tab]}}
        left:  {action: hotkey, args: {keys: [ctrl, shift, tab]}}
      vertical:
        label: Desplazar
        step: 0.16      # el scroll necesita pasos más cortos para no ir a saltos
        up:   {action: scroll, args: {amount: 120}}
        down: {action: scroll, args: {amount: -120}}
    mouse:
      vertical:
        label: Desplazar
        step: 0.16
        up:   {action: scroll, args: {amount: 120}}
        down: {action: scroll, args: {amount: -120}}
      # Pinza que se cierra y se abre sin moverse: el equivalente a un clic.
      tap: {action: mouse_click, args: {button: right}, label: Clic derecho}

# --------------------------------------------------------------------------- #
# Conmutador de ventanas: el puño despliega la rejilla, el índice señala y abrir
# la mano suelta sobre lo señalado. Llevar el dedo a un borde acopla la ventana
# a esa mitad de la pantalla en vez de solo activarla.
# --------------------------------------------------------------------------- #
switcher:
  region: [0.22, 0.18, 0.78, 0.74]  # zona del encuadre que cubre toda la rejilla
  max_windows: 9
  edge_band: 0.13       # anchura de las bandas de acoplado, en fracción de pantalla
  lost_timeout: 0.7
  confirm_frames: 3     # fotogramas con la mano abierta antes de confirmar
  snap: true

mouse:
  # Pantalla sobre la que trabaja el cursor, contando desde 0 de izquierda a
  # derecha. `null` usa la primera. Nunca se mapea sobre el escritorio virtual
  # completo: con dos monitores en horizontal la relación se va a 3:1, el
  # movimiento se estira en un eje y los bordes quedan inalcanzables.
  monitor: null
  # Porción del encuadre (x0, y0, x1, y1) que se mapea sobre la pantalla. Se
  # recorta automáticamente para que su relación coincida con la del monitor.
  # Achicarla exige menos recorrido del brazo pero amplifica el temblor.
  active_region: [0.20, 0.15, 0.80, 0.75]
  # Margen de la zona activa que aterriza contra el borde de la pantalla. Sin
  # él habría que llevar la mano al límite del encuadre —donde el seguimiento
  # se degrada— para tocar la barra de tareas o el botón de cerrar.
  edge_overscan: 0.07
  min_smoothing: 0.10         # inercia con la mano casi quieta → precisión
  max_smoothing: 0.55         # inercia con la mano rápida → respuesta
  accel_distance: 160.0       # píxeles a partir de los cuales se usa max_smoothing
  deadzone_px: 2.0
  # Fotogramas seguidos con la mano cerrada antes de pulsar el botón. Filtra las
  # lecturas sueltas de dedos recogidos que se producen al mover la mano y que
  # provocaban clics fantasma.
  press_frames: 4
  release_frames: 2
  min_index_reach: 0.80       # umbral de puño: alcance del índice sobre la palma

hud:
  show_help_on_start: true
  toast_duration: 1.8
  scanlines: true       # líneas de barrido del visor; desactívalas si molestan

# Aplicaciones lanzables. El valor se pasa a `start` de cmd, así que acepta
# ejecutables, alias del sistema (`ms-settings:`), rutas y URLs.
apps:
  navegador: chrome
  explorador: explorer.exe
  terminal: wt.exe
  calculadora: calc.exe

# Rueda de comandos: menú radial que se abre junto a la mano. Es donde viven las
# acciones que deben ser imposibles de disparar sin querer, porque exigen apuntar
# y mantener, y las que se usan de vez en cuando y no merecen un gesto propio.
wheel:
  dwell: 0.75           # segundos apuntando a una opción para confirmarla
  inner_radius: 1.15    # zona muerta central, en anchos de mano
  outer_radius: 2.7     # radio de las etiquetas, en anchos de mano
  lost_timeout: 0.6
  items:
    # El orden importa: el primero queda arriba y siguen en sentido horario.
    control:
      - {label: Nueva pestaña, action: hotkey, args: {keys: [ctrl, t]}}
      - {label: Cerrar pestaña, action: hotkey, args: {keys: [ctrl, w]}}
      - {label: Silenciar, action: volume_mute_toggle}
      - {label: Recorte de pantalla, action: hotkey, args: {keys: [win, shift, s]}}
      - {label: Modo cursor, action: set_mode, args: {mode: mouse}}
      - {label: Terminal, action: launch, args: {app: terminal}}
      - {label: Explorador, action: launch, args: {app: explorador}}
      - {label: Navegador, action: launch, args: {app: navegador}}
    mouse:
      - {label: Volver a control, action: set_mode, args: {mode: control}}
      - {label: Doble clic, action: mouse_double_click}
      - {label: Copiar, action: hotkey, args: {keys: [ctrl, c]}}
      - {label: Pegar, action: hotkey, args: {keys: [ctrl, v]}}
      - {label: Deshacer, action: hotkey, args: {keys: [ctrl, z]}}
      - {label: Cambiar de pantalla, action: next_monitor}

# REGLA: ningún gesto puede tener a la vez un disparo estático (hold/repeat) y
# barridos. La validación de arranque lo comprueba. Ya no se usan barridos en
# absoluto: todo lo direccional pasa por el gatillo de pinza.
bindings:
  # Activos en todos los modos, incluso en pausa.
  global:
    # Ojo: esto apaga el reconocimiento de gestos, NO pausa el vídeo que estés
    # viendo. Para pausar el vídeo, la uve mantenida.
    - gesture: Open_Palm
      trigger: hold
      duration: 1.5
      action: toggle_pause
      label: Apagar / encender el control
      cooldown: 1.2

  control:
    - gesture: Thumb_Up
      trigger: repeat
      interval: 0.15
      action: volume_step
      args: {delta: 2}
      label: Subir volumen
    - gesture: Thumb_Down
      trigger: repeat
      interval: 0.15
      action: volume_step
      args: {delta: -2}
      label: Bajar volumen
    - gesture: Victory
      trigger: hold
      duration: 0.7
      action: media
      args: {key: playpause}
      label: Pausar el vídeo o la música
      cooldown: 1.2
    - gesture: Closed_Fist
      trigger: hold
      duration: 0.4
      action: open_switcher
      label: Cambiar de ventana
      cooldown: 1.0
    - gesture: Pointing_Up
      trigger: hold
      duration: 0.6
      action: set_mode
      args: {mode: mouse}
      label: Modo cursor
      cooldown: 1.5
    - gesture: ILoveYou
      trigger: hold
      duration: 0.5
      action: open_wheel
      label: Rueda de comandos
      cooldown: 1.0

  mouse:
    # El cursor y el clic izquierdo no son bindings: los gobierna MouseController
    # fotograma a fotograma. El puño aquí agarra en lugar de abrir el conmutador,
    # que es lo que resulta natural con un cursor delante.
    - gesture: ILoveYou
      trigger: hold
      duration: 0.5
      action: open_wheel
      label: Rueda de comandos
      cooldown: 1.0
